<!doctype html>
<html lang="en">
  <head>
    <!-- Percent-wrapped placeholders are filled per page by build/siteMetadata.ts. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07090f" />
    <title>%PAGE_TITLE%</title>
    <meta name="description" content="%PAGE_DESCRIPTION%" />
    <meta name="author" content="%AUTHOR%" />
    <link rel="canonical" href="%PAGE_URL%" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:type" content="%OG_TYPE%" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:title" content="%PAGE_TITLE%" />
    <meta property="og:description" content="%PAGE_DESCRIPTION%" />
    <meta property="og:url" content="%PAGE_URL%" />
    <meta property="og:image" content="%SITE_URL%/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%IMAGE_ALT%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@EmInProd" />
    <meta name="twitter:creator" content="@EmInProd" />
    <script type="application/ld+json">
      %STRUCTURED_DATA%
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>%PAGE_TITLE%</h1>
      <p>%PAGE_DESCRIPTION%</p>
      <p>
        This site needs JavaScript. You can also reach %AUTHOR% on
        <a href="%LINKEDIN_URL%">LinkedIn</a>.
      </p>
    </noscript>
    <script type="module" src="/src/case-studies.tsx"></script>
  </body>
</html>
